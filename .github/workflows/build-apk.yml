name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  JAVA_VERSION: 17
  ANDROID_NDK_VERSION: 25b
  BUILD_TOOLS_VERSION: 34.0.0

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip git python3-setuptools autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo-dev cmake libffi-dev libssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==3.0.11" requests

      - name: Build APK (release)
        run: |
          yes | buildozer android release 2>&1 | tee build.log || buildozer android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-translator-apk
          path: bin/*.apk
          if-no-files-found: error
